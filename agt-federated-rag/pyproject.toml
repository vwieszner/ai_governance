[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agt-federated-rag"
version = "0.1.0"
description = "Fully governed federated cross-cluster RAG using Microsoft Agent Governance Toolkit, LangGraph, OpenFGA, and Temporal"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # ── Microsoft Agent Governance Toolkit ───────────────────────────────────
    # AGT 4.0 consolidated the per-component distributions; import names are unchanged.
    # core = Agent OS (agent_os: policy engine, MCP gateway, circuit breaker) +
    #        AgentMesh (agentmesh: DID identity, IATP, trust, lifecycle) +
    #        runtime/hypervisor. Replaces agent-os-kernel, agentmesh-platform,
    #        agentmesh-runtime, agent-hypervisor.
    # <6.0: AGT main removes agent_os.policies.PolicyEvaluator (agent/nodes.py) in
    #       favour of the ACS AgentControl runtime — migrate before lifting the cap.
    "agent-governance-toolkit-core>=5.0.0,<6.0",
    # cli = Agent SRE (agent_sre: SLOs, error budgets) + sandbox. Replaces agent-sre.
    "agent-governance-toolkit-cli>=5.0.0,<6.0",

    # ── Agent framework ───────────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # ── RAG — vector store ────────────────────────────────────────────────────
    "qdrant-client>=1.11.0",
    "fastembed>=0.4.0",

    # ── RAG — knowledge graph ─────────────────────────────────────────────────
    "neo4j>=5.23.0",
    "neo4j-graphrag>=1.2.0",

    # ── Auth: user identity (Keycloak OIDC) ──────────────────────────────────
    # AGT handles agent-to-agent identity; Keycloak handles user login
    # PyJWT (not python-jose: PYSEC-2026-4298 HS256 key confusion, unfixed upstream).
    # Asymmetric algorithms (RS256/ES256) need cryptography, already a core dependency.
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.27.0",

    # ── Auth: per-chunk ReBAC (data-level authorization) ─────────────────────
    # AGT policy engine governs agent *actions*; OpenFGA governs *data access*
    "openfga-sdk>=0.6.0",

    # ── Approval workflow ─────────────────────────────────────────────────────
    "temporalio>=1.7.0",

    # ── API server ────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # ── Task store ────────────────────────────────────────────────────────────
    "redis[asyncio]>=5.0.0",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
pii = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
]
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "langfuse>=2.15.0",
]
s3 = [   # artifact_store.py s3 backend (the local backend, default, needs nothing extra)
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
agent   = "api.main:run"
worker  = "workflow.worker:run"
ingest  = "rag.ingest:cli"

[tool.hatch.build.targets.wheel]
# Flat layout (packages + top-level modules at the project root), which hatchling's
# default file selection cannot infer. Package data (agent/policies/*.yaml) ships
# with its package. tests/, conftest.py and _repro_div.py are dev-only.
only-include = [
    "agent", "api", "auth", "bench", "connectors", "discovery", "mesh", "rag",
    "tools", "transport", "workflow",
    "approval_index.py", "artifact_store.py", "audit_log.py", "config.py",
    "outcome_store.py", "residency.py", "secrets_backend.py", "sre.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# api/main.py and workflow/worker.py both call truststore.inject_into_ssl() at
# module top BEFORE importing any ssl-using libraries (httpx, fastapi, temporalio,
# the AGT clients). Those imports must therefore sit below that call — reordering
# them to the top would break the truststore patch and load OpenSSL's default
# trust store instead of the OS one. E402 (module import not at top) is expected
# and intentional in these two entrypoints, so suppress it for them.
"api/main.py" = ["E402"]
"workflow/worker.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
python_version = "3.11"
strict = true
