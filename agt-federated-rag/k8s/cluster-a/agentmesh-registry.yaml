# AgentMesh Registry — Cluster A
#
# The AgentMesh registry is the shared trust anchor for DID resolution and
# agent identity verification.  Both cluster-a and cluster-b agents register
# their DIDs here on first startup and query it to verify peer identities.
#
# HA note: a single replica is sufficient because the registry uses Redis as
# its backend store.  All state is durable; a pod restart does not lose
# registered identities.  For higher availability run 2–3 replicas behind
# the ClusterIP service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-registry
  namespace: agt-federated-rag
  labels:
    app: mesh-registry
    component: agentmesh
spec:
  replicas: 1   # HA via Redis backend — scale to 2+ if needed
  selector:
    matchLabels:
      app: mesh-registry
  template:
    metadata:
      labels:
        app: mesh-registry
        component: agentmesh
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: registry
          image: microsoft/agentmesh-registry:3.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9000
              protocol: TCP
          env:
            - name: REGISTRY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agt-rag-secrets
                  key: REDIS_URL
                  optional: false
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-registry
  namespace: agt-federated-rag
  labels:
    app: mesh-registry
    component: agentmesh
spec:
  type: ClusterIP
  selector:
    app: mesh-registry
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP
