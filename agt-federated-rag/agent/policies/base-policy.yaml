# Base AGT policy — applies to all agent actions.
# Evaluated by the Agent OS PolicyEvaluator (agent_os.policies) before every
# governed node action via agent.nodes._enforce().
#
# Schema: agent_os.policies.PolicyDocument
#   action operators (lowercase): eq ne gt lt gte lte in not_in matches contains
#   actions (lowercase):          allow deny audit block
#
# OWASP Agentic Top 10 coverage:
#   ASI-01 Goal Hijacking   — block goal/system-prompt override actions
#   ASI-02 Excessive Caps   — least-privilege: deny-by-default, allow-list actions
#   ASI-03 Identity Abuse   — trust-score gate
#   ASI-04 Code Execution   — block shell / code-eval tool categories
version: "1.0"
name: base-policy
description: Base governance policy applied to every agent action.

# Deny everything not explicitly allowed below — opt-in, not opt-out.
defaults:
  action: deny

rules:
  # ── Identity gate (ASI-03) ───────────────────────────────────────────────
  - name: block-low-trust-agents
    priority: 1000
    condition:
      field: agent_trust_score
      operator: lt
      value: 0.6
    action: deny
    message: "Agent trust score below minimum threshold"

  # ── Goal hijacking (ASI-01) ──────────────────────────────────────────────
  - name: block-goal-override
    priority: 900
    condition:
      field: action
      operator: in
      value: [system_prompt.override, goal.replace, instruction.inject]
    action: deny
    message: "Goal hijacking attempt detected"

  # ── Dangerous tool categories (ASI-02, ASI-04) ───────────────────────────
  - name: block-code-execution
    priority: 800
    condition:
      field: tool_category
      operator: in
      value: [shell_exec, code_eval, subprocess, os_command]
    action: deny
    message: "Unrestricted code execution not permitted"

  - name: block-filesystem-writes
    priority: 800
    condition:
      field: tool_category
      operator: in
      value: [file_write, file_delete, file_move]
    action: deny
    message: "Filesystem writes not permitted for the RAG agent"

  # ── Allow-list of known-safe agent actions (ASI-02 least privilege) ──────
  # Per-request rate limiting is enforced in code (api.main._check_rate_limit),
  # and per-chunk data authorization by OpenFGA — not duplicated here.
  - name: allow-rag-retrieve
    priority: 100
    condition: {field: action, operator: eq, value: rag.retrieve}
    action: allow

  - name: allow-auth-check
    priority: 100
    condition: {field: action, operator: eq, value: auth.check_permission}
    action: allow

  - name: allow-llm-generate
    priority: 100
    condition: {field: action, operator: eq, value: llm.generate}
    action: allow

  - name: allow-approval-start
    priority: 100
    condition: {field: action, operator: eq, value: approval.start_workflow}
    action: allow

  - name: allow-peer-send
    priority: 100
    condition: {field: action, operator: eq, value: peer.send_message}
    action: allow

  - name: allow-peer-receive-callback
    priority: 100
    condition: {field: action, operator: eq, value: peer.receive_callback}
    action: allow

  # MCP tool calls (Phase-1 item 11). Allow-listed so a governed call proceeds; the
  # per-server allowlist + required auth method are enforced by the toolkit's
  # McpAuthPolicy gateway (tools.mcp), and per-tool/per-user data authorization by
  # OpenFGA. An mcp.call to an UNCONFIGURED server is rejected by the gateway (fail-closed).
  - name: allow-mcp-call
    priority: 100
    condition: {field: action, operator: eq, value: mcp.call}
    action: allow

  - name: allow-format-response
    priority: 100
    condition: {field: action, operator: eq, value: agent.format_response}
    action: allow

  # Output-DLP gate (task #10). The action is allow-listed here so a clean answer
  # passes; the high-priority `block-credential-leak-in-output` deny rule in
  # data-access-policy.yaml fires FIRST when the answer carries a credential,
  # overriding this allow (priority 950 > 100). HARD-DENY posture: a detected
  # secret aborts the whole answer (PermissionError -> generic safe message).
  - name: allow-output-check
    priority: 100
    condition: {field: action, operator: eq, value: agent.output_check}
    action: allow
