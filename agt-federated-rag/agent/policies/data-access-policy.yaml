# Data access policy — governs what the agent may retrieve and feed to the LLM.
# Evaluated by the Agent OS PolicyEvaluator (agent_os.policies).
#
# OWASP coverage:
#   ASI-02 Excessive Capabilities — chunk count cap, query length guard
#   ASI-05 Insecure Output        — credential pattern blocking in LLM output
#   ASI-06 Memory Poisoning       — block retrieval from untrusted collections
version: "1.0"
name: data-access-policy
description: Governs retrieval scope and LLM context for the agent.

# Data-access actions inherit allow at this layer; per-chunk authorization is
# enforced separately and more deeply by OpenFGA (ReBAC). The rules below add
# input-validation and output-safety guard-rails on top.
defaults:
  action: allow

rules:
  # ── Query input validation (ASI-02) ──────────────────────────────────────
  - name: reject-oversized-query
    priority: 900
    condition:
      field: query_length
      operator: gt
      value: 4096
    action: deny
    message: "Query exceeds maximum allowed length (4096 chars)"

  - name: reject-empty-query
    priority: 900
    condition:
      field: query_length
      operator: lt
      value: 1
    action: deny
    message: "Empty query rejected"

  # ── Retrieval limits (ASI-02 least privilege) ────────────────────────────
  - name: cap-chunk-retrieval
    priority: 800
    condition:
      field: requested_chunk_count
      operator: gt
      value: 50
    action: deny
    message: "Chunk retrieval cap exceeded (max 50 per query)"

  # ── Block retrieval from untrusted collections (ASI-06) ──────────────────
  - name: block-untrusted-collection
    priority: 850
    condition:
      field: qdrant_collection
      operator: not_in
      # Trusted collections. The two federated AGT clusters each own a distinct
      # per-cluster collection (cluster-a -> _agt_a, cluster-b -> _agt_b); both
      # are first-party knowledge bases provisioned by setup_agt.py.
      value: [knowledge_base, knowledge_base_agt_a, knowledge_base_agt_b]
    action: deny
    message: "Retrieval from an untrusted Qdrant collection blocked"

  # ── LLM context size guard (ASI-02) ──────────────────────────────────────
  - name: cap-llm-context
    priority: 700
    condition:
      field: context_char_count
      operator: gt
      value: 24000             # ~6000 tokens x 4 chars/token
    action: deny
    message: "LLM context exceeds the token budget — truncation required"

  # ── Block credential leakage in outbound LLM output (ASI-05) ─────────────
  - name: block-credential-leak-in-output
    priority: 950
    condition:
      field: llm_output
      operator: matches
      value: "(PRIVATE KEY|BEGIN RSA|sk-[A-Za-z0-9]{32,}|xoxb-[A-Za-z0-9-]+)"
    action: deny
    message: "Potential credential or API key detected in LLM output"
