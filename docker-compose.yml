# Federated RAG — infrastructure stack (security-hardened)
#
# Security correctness is the POINT of this stack, so the infra is hardened
# rather than left on defaults:
#   - No default credentials. Keycloak admin + Postgres passwords come from a
#     gitignored .env file (generated by setup_all.py). docker compose reads .env
#     in this directory automatically.
#   - OpenFGA requires a preshared key (Bearer token) — the authorization service
#     itself rejects unauthenticated calls. The backends send it (OPENFGA_API_TOKEN).
#   - No admin surfaces exposed: OpenFGA playground is DISABLED; gRPC port is not
#     published; only the HTTP API needed by the backends is published.
#   - Every published port binds to 127.0.0.1 (loopback) — nothing is reachable
#     from the network, only from this host.
#
#   docker compose up -d            # start everything (reads ./.env)
#   docker compose down            # stop (volumes preserved)
#   docker compose down -v         # stop AND wipe data (fresh start)
#
# TLS NOTE (honest prod-only item): intra-host traffic here is plaintext HTTP on
# loopback. A real deployment terminates TLS / enforces mTLS (the k8s manifests
# assume Istio STRICT). Self-signed certs are intentionally NOT used locally
# because they break the browser's OIDC/JWKS calls to Keycloak. See SECURITY_AUDIT.md.
#
# Qdrant (16333), Neo4j (17687), Redis (6379) run as pre-existing containers and
# are re-seeded by setup_all.py; they are not managed here.

name: federated-rag

services:
  # ── Postgres — durable datastore for OpenFGA ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: openfga
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    # Not published — only the openfga containers reach it over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── OpenFGA schema migration (runs once, then exits) ────────────────────────
  openfga-migrate:
    image: openfga/openfga:latest
    container_name: rag-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── OpenFGA — per-chunk ReBAC authorization (durable; preshared-key auth) ───
  openfga:
    image: openfga/openfga:latest
    container_name: rag-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_LEVEL: warn
      # SECURITY: require a Bearer preshared key on every API call. Without this,
      # anyone who can reach the port can read/write authorization tuples.
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_TOKEN:?set in .env}
      # SECURITY: do not run the unauthenticated web playground.
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports:
      # Only the HTTP API, bound to loopback. gRPC (8081) and playground (3000)
      # are NOT published.
      - "127.0.0.1:8089:8080"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Temporal — approval workflow engine ─────────────────────────────────────
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "warn"]
    container_name: rag-temporal
    ports:
      # gRPC frontend + web UI, loopback only.
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    restart: unless-stopped

  # ── Keycloak — OIDC identity provider (realm persisted via volume) ──────────
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--features=token-exchange,admin-fine-grained-authz"]
    container_name: rag-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - rag-keycloak-data:/opt/keycloak/data   # H2 file DB → realm/users persist
    ports:
      - "127.0.0.1:8087:8080"
    restart: unless-stopped

volumes:
  rag-postgres-data:
  rag-keycloak-data:
