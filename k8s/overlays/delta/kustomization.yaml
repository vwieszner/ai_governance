# Division Delta overlay (Risk/Data-Governance department). Mirrors infra/divisions/delta.yml.
# A self-sufficient department: its own data (Qdrant + OpenFGA) AND distinct governed tools
# (tool.risk + tool.classify), collaborating two-way with gamma (it delegates
# tool.pii/tool.compliance there). A new department = a new overlay; the base is never edited.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agt-div-delta

resources:
  - ../../base

labels:
  - pairs:
      agt.division: delta
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: agt-div
    patch: |-
      - op: replace
        path: /metadata/name
        value: agt-div-delta
      - op: replace
        path: /metadata/labels/agt.division
        value: delta
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: add
        path: /data/DIVISION_ID
        value: delta
      - op: add
        path: /data/CLUSTER_ID
        value: delta
      - op: add
        path: /data/TRUSTED_PEERS
        value: gamma
      - op: add
        path: /data/OIDC_ISSUER
        value: http://keycloak:8080/realms/rag
      - op: add
        path: /data/OIDC_JWKS_URI
        value: http://keycloak:8080/realms/rag/protocol/openid-connect/certs
      - op: add
        path: /data/OIDC_TOKEN_ENDPOINT
        value: http://keycloak:8080/realms/rag/protocol/openid-connect/token
      - op: add
        path: /data/AGENT_CLIENT_ID
        value: agent-delta
      - op: add
        path: /data/AGENT_NAME
        value: AGT RAG - Division Delta
      - op: add
        path: /data/TEMPORAL_TASK_QUEUE
        value: approval-delta
      # SELF-SUFFICIENT DEPARTMENT (Risk/Data-Governance). delta keeps its OWN data (Qdrant +
      # OpenFGA in this namespace) AND owns DISTINCT tools: the EU AI Act risk-tier classifier
      # + the data-classification tool. tools.local_tools registers only these, and the agent
      # auto-advertises them so gamma can delegate tool.risk/tool.classify here.
      - op: add
        path: /data/AGT_LOCAL_TOOLS
        value: tool.risk,tool.classify
      # TWO-WAY collaboration: for the tools delta does NOT serve (pii/compliance), route them
      # to gamma (the department that owns them). The value maps capability -> gamma's DID;
      # that DID is resolved against PEER_TRUST_MAP (wired by federation) for the data-path
      # call, so no broker is needed. DID = gamma's provisioned id (infra/generated/gamma);
      # `bootstrap_k8s.py --federate` re-derives + re-patches this from live DIDs at deploy time.
      - op: add
        path: /data/PEER_TOOL_MAP
        value: '{"tool.pii":"did:mesh:c5839df170c888e68a804abed0a46af4","tool.compliance":"did:mesh:c5839df170c888e68a804abed0a46af4"}'

images:
  - name: agt-federated-rag
    newTag: delta
