# Division Gamma overlay (Security/Legal department). Mirrors infra/divisions/gamma.yml.
# A self-sufficient department: its own data (Qdrant + OpenFGA) AND distinct governed tools
# (tool.pii + tool.compliance), collaborating two-way with delta (it delegates
# tool.risk/tool.classify there). A new department = a new overlay; the base is never edited.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agt-div-gamma

resources:
  - ../../base

labels:
  - pairs:
      agt.division: gamma
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: agt-div
    patch: |-
      - op: replace
        path: /metadata/name
        value: agt-div-gamma
      - op: replace
        path: /metadata/labels/agt.division
        value: gamma
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: add
        path: /data/DIVISION_ID
        value: gamma
      - op: add
        path: /data/CLUSTER_ID
        value: gamma
      - op: add
        path: /data/TRUSTED_PEERS
        value: alpha,beta,delta
      - op: add
        path: /data/OIDC_ISSUER
        value: http://keycloak:8080/realms/rag
      - op: add
        path: /data/OIDC_JWKS_URI
        value: http://keycloak:8080/realms/rag/protocol/openid-connect/certs
      - op: add
        path: /data/OIDC_TOKEN_ENDPOINT
        value: http://keycloak:8080/realms/rag/protocol/openid-connect/token
      - op: add
        path: /data/AGENT_CLIENT_ID
        value: agent-gamma
      - op: add
        path: /data/AGENT_NAME
        value: AGT RAG - Division Gamma
      - op: add
        path: /data/TEMPORAL_TASK_QUEUE
        value: approval-gamma
      # SELF-SUFFICIENT DEPARTMENT (Security/Legal). gamma keeps its OWN data (Qdrant +
      # OpenFGA in this namespace) AND owns DISTINCT tools: the PII/DLP screen + the EU AI
      # Act/GDPR compliance lookup. tools.local_tools registers only these, and the agent
      # auto-advertises them so delta can delegate tool.pii/tool.compliance here.
      - op: add
        path: /data/AGT_LOCAL_TOOLS
        value: tool.pii,tool.compliance
      # TWO-WAY collaboration: for the tools gamma does NOT serve (risk/classify), route them
      # to delta (the department that owns them). The value maps capability -> delta's DID;
      # that DID is resolved against PEER_TRUST_MAP (wired by federation) for the data-path
      # call, so no broker is needed. DID = delta's provisioned id (infra/generated/delta);
      # `bootstrap_k8s.py --federate` re-derives + re-patches this from live DIDs at deploy time.
      - op: add
        path: /data/PEER_TOOL_MAP
        value: '{"tool.risk":"did:mesh:4b0bf91aea366a9602c781f7dd9ff5ca","tool.classify":"did:mesh:4b0bf91aea366a9602c781f7dd9ff5ca"}'

images:
  - name: agt-federated-rag
    newTag: gamma
