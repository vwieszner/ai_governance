# Prometheus scrape config for k8s — auto-discovers the agent pods by their
# prometheus.io/scrape annotation (set in k8s/base/agent.yaml), across every agt-div-* namespace,
# with NO static target list (the Compose prometheus.yml hard-codes localhost ports). job_name is
# kept "agt-divisions" so infra/observability/alert.rules.yml (reused verbatim) matches unchanged.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: agt-divisions
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only pods that opt in via prometheus.io/scrape=true (the agent pods).
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Scrape on the annotated port (prometheus.io/port).
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Surface the namespace + derive the division id (agt-div-<id>) as a label — the alert
      # rules group by {division}.
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        regex: agt-div-(.+)
        replacement: $1
        target_label: division
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
