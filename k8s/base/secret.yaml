# TEMPLATE Secret — placeholder values, NOT real secrets. DO NOT COMMIT REAL VALUES.
#
# In production these come from the per-division secrets that
# scripts/onboard_division.py mints into infra/generated/<id>/secrets.json (each
# division has its OWN; none are shared — NFR-4). Wire them in WITHOUT editing this
# file by generating the Secret from those values at deploy time, e.g.:
#
#   # OpenFGA store/model ids come from infra/generated/<id>/state.json after the
#   # store is created; the rest from infra/generated/<id>/secrets.json.
#   kubectl -n agt-div-alpha create secret generic agent-secrets \
#     --from-literal=OPENAI_API_KEY="$NVIDIA_API_KEY" \
#     --from-literal=POSTGRES_PASSWORD="$(jq -r .postgres_password infra/generated/alpha/secrets.json)" \
#     --from-literal=OPENFGA_API_TOKEN="$(jq -r .openfga_api_token infra/generated/alpha/secrets.json)" \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD="$(jq -r .keycloak_admin_password infra/generated/alpha/secrets.json)" \
#     --from-literal=AGENT_CLIENT_SECRET="$(jq -r .agent_client_secret infra/generated/alpha/secrets.json)" \
#     --from-literal=APPROVAL_HMAC_SECRET="$(jq -r .approval_hmac_secret infra/generated/alpha/secrets.json)" \
#     --from-literal=OPENFGA_STORE_ID="$(jq -r .store_id infra/generated/alpha/state.json)" \
#     --from-literal=OPENFGA_MODEL_ID="$(jq -r .model_id infra/generated/alpha/state.json)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# That generated Secret MUST be named `agent-secrets` (overlays add the division
# nameSuffix) so it overrides this template. The Ed25519 agent DID private key
# (infra/generated/<id>/did.json + agent_identity_<id>.json) should likewise be
# mounted as a Secret volume in production so the DID is stable across pod restarts.
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  # LLM
  OPENAI_API_KEY: "REPLACE_ME_nvidia_api_key"
  # Datastore credentials (Postgres backs OpenFGA)
  POSTGRES_USER: "openfga"
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  # OpenFGA preshared API token + store/model ids (state.json after store creation)
  OPENFGA_API_TOKEN: "REPLACE_ME_openfga_api_token"
  OPENFGA_STORE_ID: "REPLACE_ME_openfga_store_id"
  OPENFGA_MODEL_ID: "REPLACE_ME_openfga_model_id"
  # Keycloak bootstrap admin
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_ME_keycloak_admin_password"
  # Agent's Keycloak client secret
  AGENT_CLIENT_SECRET: "REPLACE_ME_agent_client_secret"
  # Approval deep-link HMAC (32-byte hex)
  APPROVAL_HMAC_SECRET: "REPLACE_ME_approval_hmac_secret"
