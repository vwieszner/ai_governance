# Worker — the Temporal worker process (workflow.worker) that drives durable approval
# workflows. Same image as the agent, different entrypoint (matches the compose
# `worker` service: command python -m workflow.worker, no port). Shares the agent's
# config + secrets so it talks to the SAME per-division Temporal, OpenFGA, and Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Wait for Temporal's gRPC frontend before the worker tries to poll its queue.
        - name: wait-temporal
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z temporal 7233; do echo "waiting for temporal"; sleep 2; done
      containers:
        - name: worker
          image: agt-federated-rag:local   # overridden by kustomize images: (overlay sets the tag)
          command: ["python", "-m", "workflow.worker"]
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: fastembed-cache
              mountPath: /cache/fastembed
            - name: tmp
              mountPath: /tmp
            - name: audit-logs
              mountPath: /app/audit_logs
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: fastembed-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: audit-logs
          emptyDir: {}
