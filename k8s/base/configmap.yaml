# Non-secret division config (config.Settings via env). Mirrors the in-network
# values that scripts/onboard_division.render_agent_env writes for the compose
# `containerized` profile — but pointed at Kubernetes Service DNS (postgres, openfga,
# qdrant, redis, temporal, keycloak) on their INTERNAL ports, not the host-mapped ones.
#
# Secrets (passwords, API tokens, HMAC, NVIDIA key, OpenFGA store/model ids) live in
# the Secret (secret.yaml), NOT here. Per-division values (DIVISION_ID, OIDC issuer
# host, peer wiring) are patched by each overlay — this base carries only the values
# that are identical across divisions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  # ── Identity / residency (DIVISION_ID + CLUSTER_ID patched per overlay) ──────
  RESIDENCY_MODE: "external"
  AGENT_TRUST_THRESHOLD: "0.6"
  # Required by config.Settings (human sponsor of record for this agent). Same
  # across divisions; override per overlay if you want a division-specific sponsor.
  AGENT_SPONSOR_EMAIL: "sponsor@agt.local"

  # ── Server ───────────────────────────────────────────────────────────────────
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "info"
  SRE_ENABLED: "true"

  # ── LLM (NVIDIA NIM by default; key comes from the Secret) ───────────────────
  OPENAI_API_BASE: "https://integrate.api.nvidia.com/v1"
  LLM_MODEL: "meta/llama-3.3-70b-instruct"

  # ── Embeddings (SERVED API, not an in-pod model) ─────────────────────────────
  # On Kubernetes the dense vector comes from an OpenAI-compatible embeddings
  # endpoint (same NVIDIA NIM base as the LLM; key comes from the Secret), so the
  # pod never downloads the 1.3GB model. BM25 sparse retrieval stays local.
  # For data-residency mode, self-host this endpoint in-cluster (NIM/TEI Service)
  # exactly like the LLM and point EMBEDDING_API_BASE at it.
  EMBEDDING_PROVIDER: "api"
  EMBEDDING_MODEL: "nvidia/nv-embedqa-e5-v5"
  EMBEDDING_API_BASE: "https://integrate.api.nvidia.com/v1"

  # Retrieval cutoff TUNED FOR nv-embedqa-e5-v5 (api mode): its cosine scores run
  # much lower than bge-large — relevant chunks land ~0.30, not ~0.55 — so the
  # bge-tuned default of 0.55 would filter every real hit ("no relevant info").
  # If you switch to bge-large / local mode, raise this back to ~0.55. (Compose
  # local-mode divisions don't read this ConfigMap, so they're unaffected.)
  QDRANT_SCORE_THRESHOLD: "0.25"

  # ── In-cluster service endpoints (Kubernetes DNS, internal ports) ────────────
  # These resolve inside THIS division's namespace only — the NetworkPolicy blocks
  # cross-namespace traffic, so `qdrant`/`openfga`/`redis` always mean this division's.
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "knowledge_base"
  OPENFGA_API_URL: "http://openfga:8080"
  REDIS_URL: "redis://redis:6379/0"
  TEMPORAL_ADDRESS: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"

  # Neo4j/GraphRAG is optional + inert (retrieval degrades to Qdrant-only). config
  # still requires the fields, so set harmless defaults (no neo4j service in base).
  NEO4J_URI: "bolt://localhost:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "none"

  # ── OIDC / JWT (issuer + JWKS host patched per overlay) ──────────────────────
  ALLOWED_JWT_ALGORITHMS: "RS256"

  CORS_ORIGINS: "http://localhost:5173"

  # ── Governed cross-agent tools (capability-based delegation) ─────────────────
  # AGT_LOCAL_TOOLS: CSV of the tool capabilities THIS division SERVES locally
  # (full ids like "tool.pii" or short names like "pii"). Empty here = the base
  # default; each overlay sets its own. A PROVIDER division lists the capabilities
  # it owns (e.g. gamma = "tool.pii,tool.compliance"); a pure CONSUMER sets "" so it
  # serves none locally and must delegate. (Read by tools.local_tools._enabled_*.)
  #
  # PEER_TOOL_MAP: JSON {"<capability>": "<provider_peer_DID>"} — for a capability a
  # division does NOT serve locally, route the delegated tool call to this peer DID.
  # The DID is resolved against PEER_TRUST_MAP (the data-path trust anchor wired by
  # federation), so NO discovery broker is needed. Empty here = no static routes; the
  # consumer overlay (or the bootstrap federate step) fills it with the provider's DID.
  AGT_LOCAL_TOOLS: ""
  PEER_TOOL_MAP: ""
