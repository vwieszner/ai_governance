# Per-division PHYSICAL stack template (IMPLEMENTATION_PLAN.md M0, decision D-3).
#
# Each division is its OWN isolated stack — own Postgres+OpenFGA store, Keycloak
# realm host, Temporal, Qdrant, Redis — on its own compose project + network +
# volumes, with division-scoped published ports. NFR-2: there is no shared point
# whose loss crosses a division boundary, and one division's agent (configured
# with its own OpenFGA store) cannot read another division's store.
#
# Brought up by scripts/onboard_division.py (NOT hand-run) which renders the
# port/secret env from a division manifest and runs:
#   docker compose -p div-<id> --env-file <generated>/div-<id>.env \
#       -f infra/division-stack.template.yml up -d
# Compose namespaces container_name (via ${DIV_ID}), volumes, and the network per
# project, so N divisions coexist with zero collisions.
#
# Every published port binds to 127.0.0.1 (loopback) — nothing is network-reachable
# in dev. A real multi-cloud deployment publishes the internet-facing agent +
# discovery behind mTLS (M7); the per-division stack itself is unchanged.

name: agt-div-${DIV_ID}

services:
  postgres:
    image: postgres:16-alpine
    container_name: div-${DIV_ID}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in division env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in division env}
      POSTGRES_DB: openfga
    volumes:
      - div-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  openfga-migrate:
    image: openfga/openfga:v1.16.1   # pinned for reproducibility (was :latest)
    container_name: div-${DIV_ID}-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.16.1   # pinned for reproducibility (was :latest)
    container_name: div-${DIV_ID}-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_LEVEL: warn
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_TOKEN:?set in division env}
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports:
      - "127.0.0.1:${DIV_OPENFGA_PORT}:8080"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:1.7.0   # pinned (CLI 1.7.0 / server 1.31.0); was :latest
    # --db-filename persists to a SQLite file on a named volume so in-flight APPROVAL
    # workflows survive restart/reboot (the product's offline-approval headline).
    # Without it, start-dev is in-memory and approvals are lost. (prod B-3)
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "warn",
              "--db-filename", "/home/temporal/temporal.db"]
    container_name: div-${DIV_ID}-temporal
    volumes:
      - div-temporal-data:/home/temporal   # uid 1000 (temporal) owns this path
    ports:
      - "127.0.0.1:${DIV_TEMPORAL_PORT}:7233"
      - "127.0.0.1:${DIV_TEMPORAL_UI_PORT}:8233"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2   # pinned for reproducibility (was :latest)
    command: ["start-dev", "--features=token-exchange,admin-fine-grained-authz"]
    container_name: div-${DIV_ID}-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set in division env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in division env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - div-keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${DIV_KEYCLOAK_PORT}:8080"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16.0   # pinned for reproducibility (was :latest)
    container_name: div-${DIV_ID}-qdrant
    volumes:
      - div-qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${DIV_QDRANT_PORT}:6333"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: div-${DIV_ID}-redis
    volumes:
      - div-redis-data:/data
    ports:
      - "127.0.0.1:${DIV_REDIS_PORT}:6379"
    restart: unless-stopped

  # ── Containerized agent + worker (Phase-1 item 5; OPT-IN) ────────────────────
  # Enabled only with `--profile containerized`, so the proven host-process flow
  # (scripts/clusters.ps1) is unaffected by default. Both use the same image; they
  # reach the infra services by compose DNS name on INTERNAL ports (not the host-mapped
  # ones). The agent env is supplied via env_file = the generated .env.<id>.agent
  # (in-network values), written by onboard_division alongside the host .env.<id>.
  #
  # CAVEATS (documented): (a) OIDC_ISSUER must stay the host value baked into browser
  # tokens (e.g. http://localhost:<kc>/realms/rag) while OIDC_JWKS_URI points at the
  # internal http://keycloak:8080/... — issuer is a string check, JWKS is host-independent.
  # (b) cross-division peer URLs are host-mapped (other compose projects), so container
  # federation needs a shared docker network or host networking — single-division serving
  # works as-is.
  agent:
    profiles: ["containerized"]
    build: { context: ../../agt-federated-rag }
    image: agt-federated-rag:latest
    container_name: div-${DIV_ID}-agent
    env_file: [ "../generated/${DIV_ID}/.env.${DIV_ID}.agent" ]
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      - div-fastembed-cache:/cache/fastembed
    ports:
      - "127.0.0.1:${DIV_AGENT_PORT}:8000"
    depends_on:
      openfga: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    profiles: ["containerized"]
    image: agt-federated-rag:latest
    container_name: div-${DIV_ID}-worker
    command: ["python", "-m", "workflow.worker"]
    env_file: [ "../generated/${DIV_ID}/.env.${DIV_ID}.agent" ]
    volumes:
      - div-fastembed-cache:/cache/fastembed
    depends_on:
      - agent
    restart: unless-stopped

  # ── Production edge: route-based mTLS (production-grade peer security) ─────────
  # The recommended PRODUCTION ingress. nginx terminates TLS and enforces MUTUAL TLS on
  # the cross-division PEER routes (/a2a/*, /tasks/<id>/callback) — a peer with no/invalid
  # federation client cert is rejected at the edge — while leaving the USER plane (UI +
  # JWT) open to browsers (route-based mTLS via ssl_verify_client optional + a per-route
  # client-cert check). Defence-in-depth: the agent still verifies the DID/Ed25519
  # signature on every peer call. Certs come from scripts/issue_division_certs.py.
  #   Federation then points PEER_AGENT_URL at https://<peer-host>:<edge port>.
  # NOTE: a host running TLS-intercepting AV/proxy (e.g. Norton, corporate MITM) re-signs
  # the server cert on the wire, which breaks federation-CA server-pinning locally — a host
  # artifact, not a config issue (the cert chain + client-cert gate are independently proven).
  edge:
    profiles: ["containerized"]
    image: nginx:alpine
    container_name: div-${DIV_ID}-edge
    environment:
      AGENT_UPSTREAM: "agent:8000"
      DIV_ID: ${DIV_ID}
    volumes:
      - ../nginx/division-edge.conf.template:/etc/nginx/templates/division-edge.conf.template:ro
      - ../generated/_certs/${DIV_ID}.crt:/certs/server.crt:ro
      - ../generated/_certs/${DIV_ID}.key:/certs/server.key:ro
      - ../generated/_certs/federation-ca.crt:/certs/federation-ca.crt:ro
    ports:
      - "127.0.0.1:${DIV_EDGE_PORT:-8443}:8443"
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  div-postgres-data:
  div-keycloak-data:
  div-temporal-data:
  div-qdrant-data:
  div-redis-data:
  div-fastembed-cache:
