# Division manifest (IMPLEMENTATION_PLAN.md M0). A division is a physically
# isolated stack; scripts/onboard_division.py reads this file and stands the whole
# stack up + provisions it — NO source edits. All per-division ports derive from
# port_base (see scripts/onboard_division.py: derive_ports) so divisions never clash.
division_id: alpha
display_name: Division Alpha
port_base: 8100          # agent 8100, openfga 8101, keycloak 8102, temporal 8103/8104, qdrant 8105, redis 8106
trusted_peers: [beta]    # peer divisions this one federates with (used by M2/M3)
docs_dir: tests/docs/cluster-a
residency_mode: external
# Authz seed (demo): the doc alice may view directly, and the doc that needs the
# owner's (bob's) approval. Onboarding ingests docs_dir then seeds OpenFGA tuples.
seed_viewer: data_retention_policy
seed_approval: hr_compensation_data
