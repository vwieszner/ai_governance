# Division manifest (IMPLEMENTATION_PLAN.md M0). A division is a physically
# isolated stack; scripts/onboard_division.py reads this file and stands the whole
# stack up + provisions it — NO source edits. All per-division ports derive from
# port_base (see scripts/onboard_division.py: derive_ports) so divisions never clash.
division_id: alpha
display_name: Division Alpha
port_base: 9000          # agent 9000, openfga 9001, keycloak 9002, temporal 9003/9004, qdrant 9005, redis 9006. Clean band 8881-9328 — avoids the co-resident project's reserved ports (its BACKEND=8000+N*100+1 = 8101/8201/8401 collided with our openfga=port_base+1). See onboard_division._reserved_ports.
trusted_peers: [beta, gamma, delta, epsilon]   # full 5-way mesh: every division federates with every other (one Kubernetes backend)
docs_dir: tests/docs/cluster-a
residency_mode: external
# Authz seed: the doc alice may view directly, and the doc that needs the
# owner's (bob's) approval. Onboarding ingests docs_dir then seeds OpenFGA tuples.
seed_viewer: data_retention_policy
seed_approval: hr_compensation_data
# Optional per-division LLM gateway (LiteLLM; examples/llm-gateway/README.md). Off unless set:
#   llm_gateway: true                                   # gateway on port_base+7; agent gets a virtual key
#   llm_gateway_local_base: http://vllm.internal:8000/v1  # in-boundary model upstream (residency=local)
