division_id: delta
display_name: Division Delta
port_base: 9300          # agent 9300, openfga 9301, keycloak 9302, temporal 9303/9304, qdrant 9305, redis 9306 — free band (alpha=9000/beta=9100/gamma=9200 elsewhere).
trusted_peers: [alpha, beta, gamma, epsilon]   # full 5-way mesh: every division federates with every other (one Kubernetes backend)
docs_dir: tests/docs/cluster-b
residency_mode: external
seed_viewer: technical_architecture
seed_approval: q4_financial_results
# SELF-SUFFICIENT DEPARTMENT (Risk/Data-Governance). It keeps its OWN data (per-division
# Qdrant + OpenFGA) AND owns DISTINCT governed tools: the EU AI Act risk-tier classifier
# (tool.risk) and the data-classification/sensitivity tool (tool.classify). Departments
# collaborate BOTH ways across the mesh: delta serves risk/classify to gamma + epsilon, and
# delegates the tools it lacks — tool.pii/tool.compliance -> gamma, tool.fincheck -> epsilon
# (compute_peer_tool_map derives delta's PEER_TOOL_MAP from the peers' DIDs).
local_tools: [tool.risk, tool.classify]
# Federation: pre-authorize gamma's seeded user to reach delta's data (proves the
# cross-division path on Kubernetes — the analogue of alpha's alice reaching beta).
cross_grants:
  - user_email: alice@example.com
    home_division: gamma
    relation: viewer
    doc: technical_architecture
  - user_email: alice@example.com
    home_division: gamma
    relation: pending_approval
    doc: q4_financial_results
