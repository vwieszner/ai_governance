# Division manifest (IMPLEMENTATION_PLAN.md M0). See alpha.yml for field docs.
# Third division — proves N divisions (N>2) onboard from config with no collisions
# (test_onboarding::test_three_divisions_from_config) and supports the >=3-division e2e.
division_id: gamma
display_name: Division Gamma
port_base: 9200          # agent 9200, openfga 9201, keycloak 9202, temporal 9203/9204, qdrant 9205, redis 9206. Clean band (avoids co-resident project's reserved ports; old 8301 collided with its N=3 BACKEND). See onboard_division._reserved_ports.
trusted_peers: [alpha, beta, delta]   # delta is the k8s cross-department tool peer (two-way)
docs_dir: tests/docs/cluster-a
residency_mode: external
seed_viewer: data_retention_policy
seed_approval: hr_compensation_data
# SELF-SUFFICIENT DEPARTMENT (Security/Legal). It keeps its OWN data (per-division Qdrant +
# OpenFGA, unchanged) AND owns DISTINCT governed tools: the PII/DLP screen (tool.pii) and the
# EU AI Act/GDPR compliance lookup (tool.compliance). onboard_division writes these as
# AGT_LOCAL_TOOLS so the agent registers + advertises only them. Departments collaborate BOTH
# ways: gamma serves pii/compliance to delta, and delegates tool.risk/tool.classify to delta
# (federate_divisions.compute_peer_tool_map derives gamma's PEER_TOOL_MAP -> delta's DID).
# Omit this key to serve ALL tools (back-compat default); [] serves none.
local_tools: [tool.pii, tool.compliance]
