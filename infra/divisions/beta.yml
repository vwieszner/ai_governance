# Division manifest (IMPLEMENTATION_PLAN.md M0). See alpha.yml for field docs.
division_id: beta
display_name: Division Beta
port_base: 9100          # agent 9100, openfga 9101, keycloak 9102, temporal 9103/9104, qdrant 9105, redis 9106. Clean band (avoids co-resident project's reserved ports; old 8201 collided with its N=2 BACKEND). See onboard_division._reserved_ports.
trusted_peers: [alpha, gamma, delta, epsilon]   # full 5-way mesh: every division federates with every other (one Kubernetes backend)
docs_dir: tests/docs/cluster-b
residency_mode: external
seed_viewer: technical_architecture
seed_approval: q4_financial_results
# Cross-division pre-authorization (FR-3.7): alice (home division: alpha) may view
# beta's technical_architecture directly. scripts/federate_divisions.py writes this
# grant to beta's OpenFGA keyed by alice's namespaced (alpha-issuer, email) principal,
# so a verifiable cross-division request from her is answered immediately — no approval.
cross_grants:
  - user_email: alice@example.com
    home_division: alpha
    relation: viewer
    doc: technical_architecture
  # Cross-division APPROVAL (FR-3.x): alice (home: alpha) is pending_approval on beta's
  # q4_financial_results (bob@beta owns it). A verifiable cross-division request from her
  # routes to beta's approval workflow; on bob's approval she is granted viewer and can
  # retrieve it. Reuses the existing pending_approval routing — no check_auth change.
  - user_email: alice@example.com
    home_division: alpha
    relation: pending_approval
    doc: q4_financial_results
