[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-rag"
version = "0.1.0"
description = "Federated cross-cluster RAG with LangGraph agents, A2A protocol, OpenFGA authorization, and Temporal approval workflows"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # RAG - vector store
    "qdrant-client>=1.11.0",
    "fastembed>=0.4.0",           # BGE-M3 dense + BM25 sparse via FastEmbed

    # RAG - graph
    "neo4j>=5.23.0",
    "neo4j-graphrag>=1.2.0",

    # Auth
    "openfga-sdk>=0.6.0",
    "python-jose[cryptography]>=3.3.0",
    # LOW-7: authlib removed — RFC 8693 token exchange is implemented directly
    # with httpx POST to the OIDC token endpoint; authlib is never imported.
    "httpx>=0.27.0",

    # Approval workflow
    "temporalio>=1.7.0",

    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Task store
    "redis[asyncio]>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
# N-1: PII detection via Presidio — opt-in; requires spacy en_core_web_lg model.
# Install: pip install 'federated-rag[pii]' && python -m spacy download en_core_web_lg
pii = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
]

# N-2: distributed tracing and LLM observability — opt-in for production deployments.
# Install: pip install 'federated-rag[observability]'
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "langfuse>=2.15.0",
]

# N-3: retry helpers via tenacity — opt-in.  The core agent uses httpx timeouts
# and Temporal's built-in retry policies; tenacity is not imported at runtime.
retry = [
    "tenacity>=8.5.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
agent = "api.main:run"
worker = "workflow.worker:run"
ingest = "rag.ingest:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# M3-6: asyncio_mode = "auto" with session-scoped loop replaces the deprecated
# session-scoped event_loop fixture (removed in pytest-asyncio >= 0.23).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
python_version = "3.11"
strict = true
