# OpenFGA Helm values (chart: openfga/openfga)
# helm repo add openfga https://openfga.github.io/helm-charts
# helm install openfga openfga/openfga -n federated-rag -f openfga-values.yaml

replicaCount: 2

datastore:
  engine: postgres
  uri: "postgres://openfga:password@postgres:5432/openfga?sslmode=disable"

grpc:
  enabled: true

http:
  enabled: true

playground:
  enabled: false    # disable in production

authn:
  method: none      # set to "oidc" and configure in production

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"

# Store ID and Model ID are created post-install via OpenFGA API
# See scripts/setup-openfga.py
