# Keycloak Helm values (chart: bitnami/keycloak)
# helm repo add bitnami https://charts.bitnami.com/bitnami
# helm install keycloak bitnami/keycloak -n federated-rag -f keycloak-values.yaml

auth:
  adminUser: admin
  adminPassword: "change-me-in-production"   # override via --set or Secret

production: true
proxy: edge                                   # behind Istio / ingress

replicaCount: 2

postgresql:
  enabled: true
  auth:
    username: keycloak
    password: "keycloak-db-password"
    database: keycloak

extraEnvVars:
  - name: KC_FEATURES
    value: "token-exchange,admin-fine-grained-authz"   # enable RFC 8693 token exchange

ingress:
  enabled: true
  hostname: keycloak-b.your-domain.com
  tls: true

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"
