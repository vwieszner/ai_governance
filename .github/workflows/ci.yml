name: CI

# Enforces the project's verification gates (see README "Verification") on every
# push and pull request. Three BLOCKING gates keep `main` green:
#   1. ruff   — backend lint must stay clean
#   2. pytest — backend test suite must pass
#   3. UI     — npm ci + vitest + production build must succeed
#   4. LLM gateway — examples/llm-gateway/prove_gateway.py (11 live scenarios
#               against the pinned LiteLLM image + stub upstreams)
# One NON-BLOCKING informational step:
#   4. mypy   — a ratchet for NEW code; the legacy codebase still has ~924
#               pre-existing `--strict` findings, so it is not a gate yet.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        # The project is run from agt-federated-rag/ (conftest.py + pyproject.toml
        # live here; the README runs `cd agt-federated-rag; ... pytest tests -q`).
        working-directory: agt-federated-rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        # requirements.lock.txt pins ruff, pytest, pytest-asyncio, mypy and the
        # full runtime stack — the same versions used for local verification.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      # ── Gate 1 (BLOCKING): backend lint must stay clean ──────────────────────
      - name: Ruff lint
        run: ruff check .

      # ── Gate 2 (BLOCKING): backend test suite ────────────────────────────────
      # The 3 live-stack tests self-skip when divisions aren't running (see README).
      - name: Pytest
        run: pytest tests -q

      # ── Informational (NON-BLOCKING): mypy ratchet for NEW code ──────────────
      # The legacy codebase has ~924 pre-existing `--strict` findings, so mypy is
      # not yet a merge gate — it ratchets new modules (see [tool.mypy] override
      # in pyproject.toml). continue-on-error keeps it informational.
      - name: Mypy (informational)
        continue-on-error: true
        run: mypy .

  ui:
    name: UI (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # ── Gate 3 (BLOCKING): UI deps + unit tests + production build ────────────
      # e2e (`npm run e2e`) is intentionally excluded — it needs a live browser
      # and running division stacks, which CI does not provision.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # ── Gate 4 (BLOCKING): LLM gateway live proof ──────────────────────────────
  # Brings up examples/llm-gateway (LiteLLM pinned by digest + Postgres + stub
  # NIM/vLLM upstreams) and drives the agent's real client factories through it.
  # Guards the residency rule "no in-boundary -> external fallback" on every PR.
  llm-gateway:
    name: LLM gateway (live proof)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: examples/llm-gateway/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies (the proof imports the agent code)
        run: pip install -r agt-federated-rag/requirements.lock.txt

      - name: Generate throwaway gateway credentials
        run: |
          k="sk-$(openssl rand -hex 16)"; p="$(openssl rand -hex 16)"
          echo "::add-mask::$k"; echo "::add-mask::$p"
          echo "LITELLM_MASTER_KEY=$k" >> "$GITHUB_ENV"
          echo "GATEWAY_DB_PASSWORD=$p" >> "$GITHUB_ENV"

      - name: Start the gateway stack
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            curl -sf http://localhost:4000/health/liveliness && exit 0
            sleep 2
          done
          docker compose logs litellm | tail -50
          exit 1

      - name: Prove the gateway
        run: python examples/llm-gateway/prove_gateway.py

      - name: Gateway logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
